name: EAS Update (OTA)

# Publishes a JS/asset-only OTA update to the "production" channel on every
# push to master. This does NOT rebuild the native app — devices only pick
# this up if they're already running a build whose runtimeVersion matches
# (see app.json: runtimeVersion.policy "appVersion"). Any change that touches
# native code, permissions, or app.json's native config needs a real EAS
# build + store submission instead — this workflow won't cover that.
on:
  push:
    branches:
      - master

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install eas-cli
        run: npm install --global eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA update to production channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Setting the message via env (not interpolated straight into the
          # run script) avoids the shell re-parsing it — a multi-line commit
          # message with a "-" prefixed line gets misread as a CLI flag
          # otherwise, which is exactly what broke the last run.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: eas update --channel production --message "$(echo "$COMMIT_MESSAGE" | head -n1)" --non-interactive
